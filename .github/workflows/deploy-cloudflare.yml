name: Test and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Verify built site through the Worker
        run: |
          npx wrangler dev --port 8787 --local-upstream 127.0.0.1 > /tmp/nekadarederdi-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:site

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare assets
        run: npm run build:cloudflare
        env:
          VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_TOP_SLOT: ${{ secrets.VITE_ADSENSE_TOP_SLOT }}
          VITE_ADSENSE_RESULTS_SLOT: ${{ secrets.VITE_ADSENSE_RESULTS_SLOT }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
