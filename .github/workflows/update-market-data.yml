name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 4,10,17,24 * *"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update data
        run: npm run data:update
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          EVDS_DEPOSIT_SERIES: ${{ secrets.EVDS_DEPOSIT_SERIES }}

      - name: Verify data freshness
        run: npm run data:verify

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update market data"
          file_pattern: data/market-series.json

      - name: Deploy updated data
        if: steps.commit.outputs.changes_detected == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref main --repo "$GITHUB_REPOSITORY"
